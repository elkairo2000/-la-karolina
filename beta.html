<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA KAROLINA</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 15px;
  color: #222;
}

header {
  background: #172b4d;
  color: white;
  text-align: center;
  padding: 20px;
  border-radius: 12px;
}

nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 15px 0;
}

button {
  background: #172b4d;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 8px;
  font-weight: bold;
}

section {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
}

.item {
  padding: 12px;
  margin: 8px 0;
  background: #eee;
  border-radius: 8px;
}

.warning {
  background: #ffe0a3;
}
</style>
</head>

<body>

<header>
<h1>LA KAROLINA</h1>
<p>Control de inventario y capital</p>
</header>
<nav>
<button onclick="show('inventario')">📦 INVENTARIO</button>
<button onclick="show('agregar')">➕ AGREGAR PRODUCTO</button>
<button onclick="show('compras')">🛒 COMPRAS</button>
<button onclick="show('ventas')">💰 VENTAS</button>
<button onclick="show('capital')">🏦 CAPITAL</button>
<button onclick="show('historial')">📊 HISTORIAL</button>
</nav>

<section id="inventario">
<h2>📦 Inventario actual</h2>
<input id="buscar" placeholder="Buscar producto..." oninput="render()">
<div id="listaProductos"></div>
</section>

<section id="agregar" hidden>
<h2>➕ Agregar producto</h2>
<input id="nombre" placeholder="Nombre del producto">
<input id="estante" placeholder="Estante">
<input id="cantidad" type="number" placeholder="Cantidad">
<input id="costo" type="number" placeholder="Costo">
<button onclick="addProduct()">GUARDAR PRODUCTO</button>
</section>

<section id="compras" hidden>
<h2>🛒 Compras</h2>
<p>Registro de compras próximamente.</p>
</section>

<section id="ventas" hidden>
<h2>💰 Ventas</h2>
<p>Registro de ventas próximamente.</p>
</section>

<section id="capital" hidden>
<h2>🏦 Capital</h2>
<p>Control del capital del negocio.</p>
</section>

<section id="historial" hidden>
<h2>📊 Historial</h2>
<div id="historialLista"></div>
</section>
<script>
let products = [];

const STORAGE_KEY = "laKarolinaBeta2";

function load() {
  try {
    products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    products = [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
}

function show(id) {
  document.querySelectorAll("section").forEach(function(s) {
    s.hidden = s.id !== id;
  });

  if (id === "inventario") render();
}

function addProduct() {
  let name = document.getElementById("nombre").value.trim();
  let shelf = document.getElementById("estante").value.trim();
  let qty = Number(document.getElementById("cantidad").value);
  let cost = Number(document.getElementById("costo").value);

  if (!name || !Number.isInteger(qty) || qty < 0 || !Number.isFinite(cost) || cost < 0 ||
      document.getElementById("cantidad").value === "" ||
      document.getElementById("costo").value === "") {
    alert("Completa correctamente los datos");
    return;
  }

  products.push({name:name, shelf:shelf, qty:qty, cost:cost});
  save();

  document.getElementById("nombre").value = "";
  document.getElementById("estante").value = "";
  document.getElementById("cantidad").value = "";
  document.getElementById("costo").value = "";

  show("inventario");
  alert("Producto registrado");
}

function render() {
  let list = document.getElementById("listaProductos");
  let search = document.getElementById("buscar").value.toLowerCase();

  list.innerHTML = "";

  let filtered = products.filter(function(p) {
    return p.name.toLowerCase().includes(search);
  });

  if (filtered.length === 0) {
    list.textContent = "Todavía no hay productos registrados.";
    return;
  }

  filtered.forEach(function(p) {
    let div = document.createElement("div");
    div.className = "item";
    div.textContent = p.name + " | Estante: " + (p.shelf || "Sin asignar") +
      " | Cantidad: " + p.qty + " | Costo: " + p.cost;

    if (p.qty <= 2) {
      div.classList.add("warning");
      div.textContent += " ⚠️ EXISTENCIAS BAJAS";
    }

    list.appendChild(div);
  });
}

load();
render();
</script>
</body>
</html>
